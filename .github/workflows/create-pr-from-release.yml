- name: Create branch and update CHANGELOG
  run: |
    set -euxo pipefail

    git config user.name "github-actions[bot]"
    git config user.email "github-actions[bot]@users.noreply.github.com"

    BRANCH="docs/release-${{ github.event.client_payload.version }}"

    DEFAULT_BRANCH=$(git remote show origin | sed -n 's/.*HEAD branch: //p')
    echo "Default branch: $DEFAULT_BRANCH"
    echo "Branch: $BRANCH"

    git checkout -B "$BRANCH" "origin/$DEFAULT_BRANCH"

    if [ ! -f CHANGELOG.md ]; then
      printf "# Changelog\n\n" > CHANGELOG.md
    fi

    cat > temp_changelog.md <<EOF
## Version ${{ github.event.client_payload.version }} - ${{ github.event.client_payload.name }}
${{ steps.format-notes.outputs.response }}

[Release Link](${{ github.event.client_payload.url }})

EOF

    cat CHANGELOG.md >> temp_changelog.md
    mv temp_changelog.md CHANGELOG.md

    git add CHANGELOG.md
    git diff --cached --quiet && { echo "No changes to commit"; exit 1; }

    git commit -m "docs: update CHANGELOG for release ${{ github.event.client_payload.version }}"
    git push -u origin "$BRANCH"

- name: Create Pull Request
  run: |
    set -euxo pipefail

    DEFAULT_BRANCH=$(git remote show origin | sed -n 's/.*HEAD branch: //p')
    BRANCH="docs/release-${{ github.event.client_payload.version }}"

    gh pr create \
      --title "📚 Release ${{ github.event.client_payload.version }}: ${{ github.event.client_payload.name }}" \
      --body "Auto-generated documentation update from release

## Version ${{ github.event.client_payload.version }} - ${{ github.event.client_payload.name }}
${{ steps.format-notes.outputs.response }}

[View Release](${{ github.event.client_payload.url }})" \
      --base "$DEFAULT_BRANCH" \
      --head "$BRANCH"
  env:
    GH_TOKEN: ${{ github.token }}
