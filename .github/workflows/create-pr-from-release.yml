name: Create PR from Release

on:
  repository_dispatch:
    types: [update_docs]

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      models: read
    steps:
      - name: Validate payload
        run: |
          if [ -z "${{ github.event.client_payload.version }}" ]; then
            echo "Error: version is required"
            exit 1
          fi
          if [ -z "${{ github.event.client_payload.name }}" ]; then
            echo "Error: name is required"
            exit 1
          fi
          if [ -z "${{ github.event.client_payload.notes }}" ]; then
            echo "Error: notes is required"
            exit 1
          fi
          if [ -z "${{ github.event.client_payload.url }}" ]; then
            echo "Error: url is required"
            exit 1
          fi
      
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Analyze existing release notes format
        id: analyze-format
        run: |
          if [ -f release-notes.md ]; then
            echo "EXISTING_FORMAT<<EOF" >> $GITHUB_OUTPUT
            head -20 release-notes.md >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "EXISTING_FORMAT=No existing format found" >> $GITHUB_OUTPUT
          fi
      
      - name: Format release notes with AI
        id: format-notes
        uses: actions/ai-inference@v1
        with:
          prompt: |
            You are a technical writer tasked with formatting release notes for a CHANGELOG.md file.
            
            Existing release notes format example:
            ${{ steps.analyze-format.outputs.EXISTING_FORMAT }}
            
            New release information:
            Version: ${{ github.event.client_payload.version }}
            Name: ${{ github.event.client_payload.name }}
            Raw notes: ${{ github.event.client_payload.notes }}
            
            Instructions:
            1. Analyze the raw release notes and extract only the essential and relevant changes
            2. Format them to match the existing release notes style (using bullet points with "-")
            3. Keep it concise and professional
            4. Only include meaningful changes, skip redundant information
            5. Return ONLY the formatted bullet points, one per line, starting with "- "
            6. Do not include the version header or any other formatting
            
            Output only the bullet points for this release.
      
      - name: Create branch and update CHANGELOG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          BRANCH="docs/release-${{ github.event.client_payload.version }}"
          git checkout -b "$BRANCH"
          
          # Create CHANGELOG.md if it doesn't exist
          if [ ! -f CHANGELOG.md ]; then
            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
          fi
          
          # Add new release notes with AI-formatted content
          cat << 'EOF' > temp_changelog.md
          ## Version ${{ github.event.client_payload.version }}
          ${{ steps.format-notes.outputs.response }}
          
          [Release Link](${{ github.event.client_payload.url }})
          
          EOF
          
          cat CHANGELOG.md >> temp_changelog.md
          mv temp_changelog.md CHANGELOG.md
          
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG for release ${{ github.event.client_payload.version }}"
          git push origin "$BRANCH"
      
      - name: Create Pull Request
        run: |
          gh pr create \
            --title "📚 Release ${{ github.event.client_payload.version }}" \
            --body "Auto-generated documentation update from release

          ## Version ${{ github.event.client_payload.version }}

          ${{ steps.format-notes.outputs.response }}

          [View Release](${{ github.event.client_payload.url }})" \
            --base main \
            --head "docs/release-${{ github.event.client_payload.version }}"
        env:
          GH_TOKEN: ${{ github.token }}
