name: Create PR from Release

on:
  repository_dispatch:
    types: [update_docs]

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      models: read 
      pull-requests: write
    steps:
      - name: Validate payload
        run: |
          if [ -z "${{ github.event.client_payload.version }}" ]; then
            echo "Error: version is required"
            exit 1
          fi
          if [ -z "${{ github.event.client_payload.name }}" ]; then
            echo "Error: name is required"
            exit 1
          fi
          if [ -z "${{ github.event.client_payload.notes }}" ]; then
            echo "Error: notes is required"
            exit 1
          fi
          if [ -z "${{ github.event.client_payload.url }}" ]; then
            echo "Error: url is required"
            exit 1
          fi
      
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Analyze existing release notes format
        id: analyze-format
        run: |
          if [ -f release-notes.md ] && [ -s release-notes.md ]; then
            echo "EXISTING_FORMAT<<DELIMITER_EOF" >> $GITHUB_OUTPUT
            head -20 release-notes.md | sed 's/DELIMITER_EOF/DELIMITER_E0F/g' >> $GITHUB_OUTPUT
            echo "DELIMITER_EOF" >> $GITHUB_OUTPUT
          else
            echo "EXISTING_FORMAT<<DELIMITER_EOF" >> $GITHUB_OUTPUT
            echo "# Release Notes" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "## Version 1.0.0" >> $GITHUB_OUTPUT
            echo "- Initial release" >> $GITHUB_OUTPUT
            echo "- Basic documentation structure" >> $GITHUB_OUTPUT
            echo "DELIMITER_EOF" >> $GITHUB_OUTPUT
          fi
      
      - name: Format release notes with AI
        id: format-notes
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4.1
          prompt: |
            You are a technical writer tasked with formatting release notes for a release-notes.md file.
            
            Existing release notes format example:
            ${{ steps.analyze-format.outputs.EXISTING_FORMAT }}
            
            New release information:
            Version: ${{ github.event.client_payload.version }}
            Name: ${{ github.event.client_payload.name }}
            Raw notes: ${{ github.event.client_payload.notes }}
            
            Instructions:
            1. Analyze the raw release notes and extract only the essential and relevant changes
            2. Format them to match the existing release notes style (using bullet points with "-")
            3. Keep it concise and professional
            4. Only include meaningful changes, skip redundant information
            5. Return ONLY the formatted bullet points, one per line, starting with "- "
            6. Do not include the version header or any other formatting
            
            Output only the bullet points for this release.
      
      - name: Validate AI response
        run: |
          RESPONSE="${{ steps.format-notes.outputs.response }}"
          TRIMMED=$(echo "$RESPONSE" | tr -d '[:space:]')
          if [ -z "$TRIMMED" ]; then
            echo "Error: AI inference returned empty or whitespace-only response"
            exit 1
          fi
          
          if ! echo "$RESPONSE" | grep -q '^- '; then
            echo "Warning: AI response doesn't contain expected bullet point format"
            echo "Response: $RESPONSE"
          fi
      
      - name: Update release-notes.md
        run: |
          # Create release-notes.md if it doesn't exist
          if [ ! -f release-notes.md ]; then
            echo "# Release Notes" > release-notes.md
            echo "" >> release-notes.md
          fi
          
          # Create temporary file with new content
          {
            echo "## Version ${{ github.event.client_payload.version }} - ${{ github.event.client_payload.name }}"
            echo ""
            echo "${{ steps.format-notes.outputs.response }}"
            echo ""
            echo "[Release Link](${{ github.event.client_payload.url }})"
            echo ""
            echo "---"
            echo ""
          } > temp_new_entry.md
          
          # Combine with existing release-notes.md
          cat temp_new_entry.md release-notes.md > temp_release_notes.md
          mv temp_release_notes.md release-notes.md
          rm temp_new_entry.md
          
          # Show changes for debugging
          echo "=== release-notes.md contents ==="
          cat release-notes.md
          echo "=== End of release-notes.md ==="
      
      - name: Check for changes
        id: check-changes
        run: |
          git add release-notes.md
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected in release-notes.md"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in release-notes.md"
            git diff --cached
          fi
      
      - name: Create branch and commit
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          BRANCH="docs/release-${{ github.event.client_payload.version }}"
          
          echo "Current branch: $(git branch --show-current)"
          echo "Creating new branch: $BRANCH"
          
          # Delete remote branch if exists
          git push origin --delete "$BRANCH" 2>/dev/null || echo "Remote branch doesn't exist, continuing..."
          
          # Create and switch to new branch
          git checkout -b "$BRANCH"
          
          echo "Switched to branch: $(git branch --show-current)"
          
          # Commit changes
          git commit -m "docs: update release notes for version ${{ github.event.client_payload.version }}"
          
          echo "Commit created:"
          git log -1 --oneline
          
          # Push to remote
          echo "Pushing to origin/$BRANCH"
          git push -u origin "$BRANCH"
          
          echo "Push completed successfully"
          
          # Verify remote branch exists
          git ls-remote --heads origin "$BRANCH"
      
      - name: Create Pull Request
        if: steps.check-changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="docs/release-${{ github.event.client_payload.version }}"
          
          echo "Checking for existing PR..."
          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null || echo "")
          
          if [ -n "$EXISTING_PR" ]; then
            echo "Updating existing PR #$EXISTING_PR"
            gh pr edit "$EXISTING_PR" \
              --title "📚 Release ${{ github.event.client_payload.version }}: ${{ github.event.client_payload.name }}" \
              --body "Auto-generated documentation update from release

          ## Version ${{ github.event.client_payload.version }} - ${{ github.event.client_payload.name }}

          ${{ steps.format-notes.outputs.response }}

          [View Release](${{ github.event.client_payload.url }})"
          else
            echo "Creating new PR..."
            # Wait a moment for GitHub to sync
            sleep 2
            
            gh pr create \
              --title "📚 Release ${{ github.event.client_payload.version }}: ${{ github.event.client_payload.name }}" \
              --body "Auto-generated documentation update from release

          ## Version ${{ github.event.client_payload.version }} - ${{ github.event.client_payload.name }}

          ${{ steps.format-notes.outputs.response }}

          [View Release](${{ github.event.client_payload.url }})" \
              --base master \
              --head "$BRANCH"
          fi
      
      - name: No changes detected
        if: steps.check-changes.outputs.has_changes == 'false'
        run: |
          echo "⚠️ No changes were detected in release-notes.md"
          echo "This might mean the release notes are identical to existing content"
          exit 0
